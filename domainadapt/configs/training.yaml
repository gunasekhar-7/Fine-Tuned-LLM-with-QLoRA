training:
  output_dir: "artifacts/trained_adapter"
  epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2e-4
  weight_decay: 0.01
  optim: "adamw_torch"
  max_grad_norm: 1.0
  max_seq_length: 512
  logging_steps: 10
  save_steps: 50
  seed: 42
  use_gradient_checkpointing: True
  fp16: False
  bf16: False