name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run unit & integration tests
        run: |
          python -m pytest tests/ -v --durations=10

      - name: Verify zero split leakage invariant
        run: |
          python -c "from src.data import load_jsonl, check_split_leakage; train = load_jsonl('data/processed/train.jsonl'); val = load_jsonl('data/processed/val.jsonl'); test = load_jsonl('data/processed/test.jsonl'); leaks = check_split_leakage(train, val, test); assert all(len(v) == 0 for v in leaks.values()), f'Data leakage detected: {leaks}'"
